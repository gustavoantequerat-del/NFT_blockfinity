# Blueprint de Render. Si conectas el repo como "Blueprint", Render lee este
# archivo y configura el servicio automáticamente. Si ya tienes un Web Service
# creado a mano, no necesitas esto: solo copia el buildCommand y el startCommand
# de abajo en la configuración de tu servicio.
services:
  - type: web
    name: nft-blockfinity
    runtime: node
    plan: free
    # El build instala el backend, instala la app de registro (con devDeps para
    # que Vite esté disponible) y la compila -> genera registro-wallet/dist,
    # que es exactamente lo que faltaba y causaba "Cannot GET /registro".
    buildCommand: npm run build
    startCommand: npm start
    # OJO: si en tu repo la carpeta NFT_blockfinity es una subcarpeta (y no la
    # raíz), descomenta la línea siguiente para que Render trabaje dentro de ella.
    # rootDir: NFT_blockfinity
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      # Secreto para firmar los JWT. Render lo genera solo la primera vez.
      - key: JWT_SECRET
        generateValue: true
      # ---- Client ID de Web3Auth: se INCRUSTA EN EL BUILD (Vite) ----
      # Tiene que existir ANTES del build o el modal de registro no funcionará.
      - key: VITE_WEB3AUTH_CLIENT_ID
        sync: false
      # ---- Blockchain (el servidor valida la red al arrancar) ----
      - key: RPC_URL
        sync: false
      - key: EXPECTED_CHAIN_ID
        sync: false
      - key: EXPLORER_BASE_URL
        sync: false
      - key: UNIVERSITY_WALLET
        sync: false
      - key: PRIVATE_KEY
        sync: false
      - key: CONTRACT_ADDRESS
        sync: false
      # ---- Pinata / IPFS ----
      - key: PINATA_API_KEY
        sync: false
      - key: PINATA_SECRET_API_KEY
        sync: false
      # ---- Posición del nombre en la plantilla PDF ----
      - key: CERT_NAME_PAGE_INDEX
        value: "0"
      - key: CERT_NAME_Y
        value: "300"
      - key: CERT_NAME_FONT_SIZE
        value: "28"
